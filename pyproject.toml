[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qcrypto-trader"
version = "0.1.0"
description = "Local Binance quant trading backend with paper trading, risk controls, and a FastAPI dashboard."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.26",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = []
build = ["pyinstaller>=6.3"]

[project.scripts]
qcrypto-trader = "qcrypto_trader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

